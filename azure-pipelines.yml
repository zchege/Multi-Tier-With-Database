
trigger: 
   none

pool:
  name: DevOpsPool
  demands:
    - agent.name -equals MyAgent

stages:
  - stage: compile
    displayName: 'Maven Compile'
    jobs:
      - job: maven_compile
        steps:
        - task: Maven@4
          inputs:
           azureSubscription: 'devopshack-conn'
           mavenPomFile: 'pom.xml'
           goals: 'compile'
           publishJUnitResults: true
           testResultsFiles: '**/surefire-reports/TEST-*.xml'
           javaHomeOption: 'JDKVersion'
           mavenVersionOption: 'Default'
           mavenAuthenticateFeed: false
           effectivePomSkip: false
           sonarQubeRunAnalysis: false

  - stage: test
    displayName: 'Maven Test'
    jobs:
      - job: maven_test
        steps:
          - task: Maven@4
            inputs:
             azureSubscription: 'devopshack-conn'
             mavenPomFile: 'pom.xml'
             goals: 'test'
             publishJUnitResults: true
             testResultsFiles: '**/surefire-reports/TEST-*.xml'
             javaHomeOption: 'JDKVersion'
             mavenVersionOption: 'Default'
             mavenAuthenticateFeed: false
             effectivePomSkip: false
             sonarQubeRunAnalysis: false
             
  - stage: trivy_fs
    displayName: 'Trivy FS Scan'
    jobs:
      - job: 'trivy_fs_scan'
        displayName: 'Trivy FS Scan'
        steps:
          - task: CmdLine@2
            inputs:
             script: 'trivy fs --format table -o fs.html .'
        
  - stage: sonarqube
    displayName: 'SonarAnalysis'
    jobs:
      - job: 'sonarqube_analysis'
        steps: 
          - task: SonarQubePrepare@7
            inputs:
              SonarQube: 'sonar-svc'
              scannerMode: 'cli'
              configMode: 'manual'
              cliProjectKey: 'bankapp'
              cliProjectName: 'bankapp'
              cliSources: '.'
              extraProperties: 'sonar.java.binaries=.'
              
          - task: SonarQubeAnalyze@7
            inputs:
              jdkversion: 'JAVA_HOME_17_X64'